<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Retro Vector HUD</title>

  <!-- iOS Safari WebApp Integration -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="HUD">

  <!-- Retro Digital Schriftart (Orbitron / Share Tech Mono) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">

  <style>
    :root {
      --accent-color: #ff0033;
      --accent-glow: rgba(255, 0, 51, 0.7);
      --bg-color: #000000;
      --danger-color: #ff0033;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    body, html {
      background-color: var(--bg-color);
      color: var(--accent-color);
      font-family: 'Share Tech Mono', monospace;
      overflow: hidden;
      height: 100%;
      width: 100%;
    }

    /* Haupt-Container für HUD-Spiegelung */
    #app-container {
      width: 100%;
      height: 100%;
      position: relative;
      transition: transform 0.3s ease-in-out;
      border: 0px solid transparent;
    }

    .hud-mode {
      transform: scaleY(-1);
    }

    /* Pulsierender roter Warnrahmen bei Tempoverstoß */
    .speed-warning {
      animation: pulseWarning 0.8s infinite alternate;
    }

    @keyframes pulseWarning {
      0% {
        box-shadow: inset 0 0 30px rgba(255, 0, 51, 0.5);
        border: 4px solid rgba(255, 0, 51, 0.7);
      }
      100% {
        box-shadow: inset 0 0 70px rgba(255, 0, 51, 1);
        border: 4px solid rgba(255, 0, 51, 1);
      }
    }

    /* Native Canvas Fläche */
    #hudCanvas {
      width: 100%;
      height: 100%;
      display: block;
      background-color: #000000;
    }

    /* Oben Links: Digitales Tempolimit */
    #limit-display {
      position: absolute;
      top: calc(25px + env(safe-area-inset-top));
      left: calc(25px + env(safe-area-inset-left));
      z-index: 20;
      pointer-events: none;
    }

    .limit-value {
      font-family: 'Orbitron', sans-serif;
      font-size: 3.6rem;
      font-weight: 900;
      letter-spacing: 2px;
      line-height: 1;
      text-shadow: 0 0 25px var(--accent-glow);
    }

    /* Unten Mitte: Digitale Geschwindigkeit */
    #speed-display {
      position: absolute;
      bottom: calc(20px + env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      pointer-events: none;
    }

    .speed-value {
      font-family: 'Orbitron', sans-serif;
      font-size: 8.5rem;
      font-weight: 900;
      line-height: 0.75;
      letter-spacing: -2px;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 0 40px var(--accent-glow);
    }

    /* Dezent erreichbare Controls Oben Rechts ("Ghost"-Look) */
    #controls {
      position: absolute;
      top: calc(20px + env(safe-area-inset-top));
      right: calc(20px + env(safe-area-inset-right));
      z-index: 30;
      display: flex;
      gap: 8px;
      opacity: 0.3;
      transition: opacity 0.3s ease;
    }

    #controls:hover, #controls:active {
      opacity: 0.9;
    }

    button {
      font-family: 'Orbitron', sans-serif;
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid var(--accent-color);
      color: var(--accent-color);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 1px;
      cursor: pointer;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    button:active {
      background: var(--accent-color);
      color: #000;
    }

    /* Demo Steuerung - erscheint im Demo Modus */
    #demo-controls {
      position: absolute;
      top: calc(65px + env(safe-area-inset-top));
      right: calc(20px + env(safe-area-inset-right));
      z-index: 30;
      display: none;
      flex-direction: column;
      gap: 6px;
    }

    #demo-controls button {
      border-color: rgba(255, 255, 255, 0.4);
      background: rgba(0, 0, 0, 0.85);
      font-size: 0.65rem;
    }

    /* Subtiler Status-Punkt unten links */
    #status-dot {
      position: absolute;
      bottom: calc(15px + env(safe-area-inset-bottom));
      left: calc(20px + env(safe-area-inset-left));
      z-index: 20;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: var(--accent-color);
      opacity: 0.3;
    }

    /* Minimales Start-Overlay */
    #gps-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #000000;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 30px;
    }

    .start-gps-btn {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.1rem;
      padding: 16px 32px;
      border-radius: 16px;
      width: 100%;
      max-width: 260px;
      background: transparent;
      border: 1px solid var(--accent-color);
      color: var(--accent-color);
      font-weight: 900;
      letter-spacing: 2px;
    }

    .demo-btn {
      font-family: 'Orbitron', sans-serif;
      margin-top: 15px;
      background: transparent;
      border: 1px solid #333;
      color: #888;
      padding: 12px 24px;
      border-radius: 12px;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <!-- Start Screen Overlay -->
  <div id="gps-overlay">
    <button class="start-gps-btn" onclick="startGPSExplicit()">START GPS</button>
    <button class="demo-btn" onclick="startDemoMode()">DEMO TROISDORF</button>
  </div>

  <div id="app-container">
    <canvas id="hudCanvas"></canvas>

    <!-- Oben Links: Reiner Tempolimit-Wert -->
    <div id="limit-display">
      <span id="speed-limit" class="limit-value">50</span>
    </div>

    <!-- Controls Oben Rechts -->
    <div id="controls">
      <button onclick="toggleDayNightManual()">MODE</button>
      <button id="hud-btn" onclick="toggleHUD()">HUD</button>
    </div>

    <!-- Demo Tempo Knöpfe -->
    <div id="demo-controls">
      <button onclick="setDemoSpeed(0)">0 KM/H (TOP DOWN)</button>
      <button onclick="setDemoSpeed(10)">10 KM/H (3D VIEW)</button>
      <button onclick="setDemoSpeed(60)">60 KM/H (SPEEDING)</button>
    </div>

    <!-- Status Punkt -->
    <div id="status-dot"></div>

    <!-- Unten Mitte: Geschwindigkeits-Wert -->
    <div id="speed-display">
      <span id="speed" class="speed-value">0</span>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('hudCanvas');
    const ctx = canvas.getContext('2d');

    let currentSpeed = 0;
    let speedLimit = 50;
    let isDemo = false;

    // Aktuelle GPS-Koordinaten und Blickwinkel
    let currentLat = 50.8163;
    let currentLng = 7.1725;
    let currentHeading = 45; // Grad (Fahrtrichtung)

    // Kamera-Neigung (0.0 = Top Down, 1.0 = Volle 3D-Kurven-Sicht)
    let currentPitch = 0; 
    let targetPitch = 0;

    // Sichtweite in Metern (Zoom/Sichtbereich)
    let viewRange = 300; 
    let targetViewRange = 300;

    // Reale Vektor-Straßendaten (OpenStreetMap)
    let realRoads = [];
    let lastFetchedPos = null;

    const themes = {
      night: { hex: '#ff0033', glow: 'rgba(255, 0, 51, 0.7)' },
      day: { hex: '#ffffff', glow: 'rgba(255, 255, 255, 0.7)' }
    };
    let currentMode = 'night';

    function resizeCanvas() {
      canvas.width = window.innerWidth * window.devicePixelRatio;
      canvas.height = window.innerHeight * window.devicePixelRatio;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Lädt echte Straßenvektoren aus der Umgebung via OpenStreetMap Overpass-API
    async function fetchRealRoads(lat, lng) {
      if (lastFetchedPos) {
        const dLat = Math.abs(lat - lastFetchedPos.lat);
        const dLng = Math.abs(lng - lastFetchedPos.lng);
        if (dLat < 0.002 && dLng < 0.002) return; // Nur alle ~200m erneuern
      }
      lastFetchedPos = { lat, lng };

      try {
        const query = `[out:json];way(around:1000,${lat},${lng})["highway"];out geometry;`;
        const res = await fetch(`https://overpass-api.de/api/interpreter?data=${encodeURIComponent(query)}`);
        const data = await res.json();

        if (data.elements) {
          realRoads = data.elements.filter(el => el.geometry).map(el => {
            return {
              tags: el.tags,
              nodes: el.geometry.map(pt => ({ lat: pt.lat, lng: pt.lon }))
            };
          });
        }
      } catch (e) {
        // Fallback
      }
    }

    // Wandelt WGS84 Koordinaten in relative Meter bezüglich der aktuellen Auto-Position um
    function gpsToLocalMeters(lat, lng, refLat, refLng) {
      const rad = Math.PI / 180;
      const x = (lng - refLng) * 111320 * Math.cos(refLat * rad);
      const y = (lat - refLat) * 110540;
      return { x, y };
    }

    // Rendering-Schleife mit echten Straßenvektoren
    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const w = canvas.width;
      const h = canvas.height;
      const cx = w / 2;
      const cy = h * 0.75; // Autoposition unten mittig
      const accent = themes[currentMode].hex;

      // Flüssige Übergangs-Animation für Neigung & Sichtweite
      currentPitch += (targetPitch - currentPitch) * 0.04;
      viewRange += (targetViewRange - viewRange) * 0.04;

      ctx.save();
      ctx.translate(cx, cy);

      const headingRad = (currentHeading * Math.PI) / 180;
      const cosH = Math.cos(-headingRad);
      const sinH = Math.sin(-headingRad);

      // Zeichne alle echten Straßen aus der Umgebung
      if (realRoads.length > 0) {
        ctx.strokeStyle = accent;
        ctx.shadowColor = accent;
        ctx.shadowBlur = 15;
        ctx.lineWidth = 6;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        realRoads.forEach(road => {
          ctx.beginPath();
          let pointDrawn = false;

          road.nodes.forEach((node, idx) => {
            // Relative Koordinaten in Metern berechnen
            const local = gpsToLocalMeters(node.lat, node.lng, currentLat, currentLng);

            // In Fahrtrichtung drehen
            const rotX = local.x * cosH - local.y * sinH;
            const rotY = local.x * sinH + local.y * cosH;

            // In Bildschirm-Koordinaten projizieren (rotY ist Distanz nach vorne)
            const forwardDist = rotY; // Meter vor dem Auto
            const sideDist = rotX;     // Meter seitlich vom Auto

            // Nur Punkte im Sichtbereich rendern
            if (forwardDist > -50 && forwardDist < viewRange) {
              // 3D Perspektiven-Projektion
              const perspectiveScale = 1 / (1 + (forwardDist * 0.0025 * currentPitch));
              
              const screenX = sideDist * 2.5 * perspectiveScale;
              const screenY = -forwardDist * 2.5 * perspectiveScale * (1 - (currentPitch * 0.45));

              if (!pointDrawn) {
                ctx.moveTo(screenX, screenY);
                pointDrawn = true;
              } else {
                ctx.lineTo(screenX, screenY);
              }
            }
          });

          if (pointDrawn) ctx.stroke();
        });
      }

      ctx.restore();

      // Fade-Out Nebel am Horizont (schneidet die Straßen auf 'viewRange' ab)
      const fadeGrad = ctx.createRadialGradient(cx, cy - (viewRange * 0.3 * currentPitch), 50, cx, cy, viewRange * 0.85);
      fadeGrad.addColorStop(0, 'rgba(0, 0, 0, 0)');
      fadeGrad.addColorStop(0.75, 'rgba(0, 0, 0, 0.3)');
      fadeGrad.addColorStop(1, 'rgba(0, 0, 0, 1)');
      
      ctx.fillStyle = fadeGrad;
      ctx.fillRect(0, 0, w, h);

      // Digitaler Retro-Pfeil (Auto)
      ctx.save();
      ctx.translate(cx, cy);
      ctx.fillStyle = accent;
      ctx.shadowColor = accent;
      ctx.shadowBlur = 25;

      ctx.beginPath();
      ctx.moveTo(0, -30);
      ctx.lineTo(22, 22);
      ctx.lineTo(0, 10);
      ctx.lineTo(-22, 22);
      ctx.closePath();
      ctx.fill();

      ctx.restore();

      requestAnimationFrame(render);
    }

    // Kamera-Perspektiven Logik (0-5 km/h Top-Down, > 5 km/h 3D)
    function updatePerspective(kmh) {
      currentSpeed = kmh;
      document.getElementById('speed').innerText = kmh;

      if (kmh > 5) {
        targetPitch = 1.0; // Stufenloser 3D-Übergang
        targetViewRange = Math.min(350 + (kmh * 7), 900); // Erweitert Sichtweite dynamisch auf bis zu 900m
      } else {
        targetPitch = 0.0; // Stufenlose Top-Down Vogelperspektive
        targetViewRange = 250; // Naher 250m Umkreis
      }

      checkSpeedingAlert(kmh);
    }

    function checkSpeedingAlert(kmh) {
      const container = document.getElementById('app-container');
      if (speedLimit && kmh > speedLimit) {
        container.classList.add('speed-warning');
      } else {
        container.classList.remove('speed-warning');
      }
    }

    // Live GPS
    function startGPSExplicit() {
      if ("geolocation" in navigator) {
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            document.getElementById('gps-overlay').style.display = 'none';
            startContinuousTracking();
          },
          (err) => {
            alert("GPS im iPhone aktivieren: Einstellungen -> Datenschutz -> Ortungsdienste.");
          },
          { enableHighAccuracy: true }
        );
      }
    }

    function startContinuousTracking() {
      navigator.geolocation.watchPosition(
        (pos) => {
          if (isDemo) return;
          
          currentLat = pos.coords.latitude;
          currentLng = pos.coords.longitude;
          if (pos.coords.heading !== null && !isNaN(pos.coords.heading)) {
            currentHeading = pos.coords.heading;
          }

          const speedMS = pos.coords.speed || 0;
          const kmh = Math.round(speedMS * 3.6);
          updatePerspective(kmh);

          fetchRealRoads(currentLat, currentLng);
        },
        (err) => {},
        { enableHighAccuracy: true, maximumAge: 1000, timeout: 10000 }
      );
    }

    // Demo Mode für Troisdorf Aggerstraße
    let demoStepIndex = 0;
    const demoPath = [
      { lat: 50.8163, lng: 7.1725, heading: 45 },  // Aggerstraße 49
      { lat: 50.8168, lng: 7.1732, heading: 40 },
      { lat: 50.8175, lng: 7.1742, heading: 55 },
      { lat: 50.8181, lng: 7.1755, heading: 70 },
      { lat: 50.8185, lng: 7.1768, heading: 90 },
      { lat: 50.8163, lng: 7.1725, heading: 45 }
    ];

    function startDemoMode() {
      isDemo = true;
      document.getElementById('gps-overlay').style.display = 'none';
      document.getElementById('demo-controls').style.display = 'flex';
      
      // Echte Straßenvektoren um die Aggerstraße laden
      fetchRealRoads(50.8163, 7.1725);
      
      setDemoSpeed(10);

      // Bewegungs-Loop im Demo-Modus
      setInterval(() => {
        demoStepIndex = (demoStepIndex + 1) % demoPath.length;
        const pt = demoPath[demoStepIndex];
        currentLat = pt.lat;
        currentLng = pt.lng;
        currentHeading = pt.heading;
      }, 2500);
    }

    function setDemoSpeed(speed) {
      updatePerspective(speed);
    }

    function applyTheme(mode) {
      const theme = themes[mode];
      document.documentElement.style.setProperty('--accent-color', theme.hex);
      document.documentElement.style.setProperty('--accent-glow', theme.glow);
    }

    function toggleDayNightManual() {
      currentMode = (currentMode === 'night') ? 'day' : 'night';
      applyTheme(currentMode);
    }

    function toggleHUD() {
      const container = document.getElementById("app-container");
      const btn = document.getElementById("hud-btn");
      container.classList.toggle("hud-mode");
      btn.classList.toggle("active");
    }

    window.onload = () => {
      const hour = new Date().getHours();
      currentMode = (hour >= 19 || hour < 6) ? 'night' : 'day';
      applyTheme(currentMode);

      render();
    };
  </script>
</body>
</html>
