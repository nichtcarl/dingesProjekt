<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Minimal HUD Navigation</title>

  <!-- WebApp-Optimierung für iOS Safari Vollbild -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="HUD Nav">

  <!-- MapLibre GL CSS -->
  <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />

  <style>
    :root {
      --accent-color: #00ffcc;
      --accent-glow: rgba(0, 255, 204, 0.6);
      --bg-color: #000000;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    body, html {
      background-color: var(--bg-color);
      color: var(--accent-color);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      height: 100%;
      width: 100%;
    }

    /* Container für HUD-Spiegelung */
    #app-container {
      width: 100%;
      height: 100%;
      position: relative;
      transition: transform 0.3s ease-in-out;
    }

    .hud-mode {
      transform: scaleY(-1);
    }

    /* Kartenbereich */
    #map {
      width: 100%;
      height: 100%;
      background-color: #000000;
    }

    /* Dashboard UI Overlay */
    #dashboard {
      position: absolute;
      bottom: calc(25px + env(safe-area-inset-bottom));
      left: calc(25px + env(safe-area-inset-left));
      right: calc(25px + env(safe-area-inset-right));
      z-index: 10;
      pointer-events: none;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }

    .speed-container {
      display: flex;
      align-items: baseline;
    }

    .speed-value {
      font-size: 7.5rem;
      font-weight: 900;
      line-height: 0.8;
      letter-spacing: -3px;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 0 30px var(--accent-glow);
    }

    .speed-unit {
      font-size: 1.8rem;
      font-weight: 700;
      margin-left: 10px;
      opacity: 0.8;
    }

    /* Tempolimit Schild */
    .speed-limit-badge {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background-color: #000000;
      border: 6px solid #ff3333;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 0 20px rgba(255, 51, 51, 0.6);
      transition: all 0.3s ease;
    }

    .speed-limit-badge.unknown {
      border-color: #444444;
      box-shadow: none;
      opacity: 0.4;
    }

    .speed-limit-value {
      color: #ffffff;
      font-size: 2.2rem;
      font-weight: 900;
    }

    /* Controls oben rechts */
    #controls {
      position: absolute;
      top: calc(20px + env(safe-area-inset-top));
      right: calc(20px + env(safe-area-inset-right));
      z-index: 20;
      display: flex;
      gap: 10px;
    }

    button {
      background: rgba(0, 0, 0, 0.85);
      border: 1.5px solid var(--accent-color);
      color: var(--accent-color);
      padding: 12px 18px;
      border-radius: 14px;
      font-size: 0.9rem;
      font-weight: 800;
      cursor: pointer;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 0 15px var(--accent-glow);
      transition: all 0.2s ease;
    }

    button:active {
      transform: scale(0.92);
      background: var(--accent-color);
      color: #000;
    }

    button.active {
      background: var(--accent-color);
      color: #000;
    }

    /* Statusanzeige */
    #status {
      position: absolute;
      top: calc(20px + env(safe-area-inset-top));
      left: calc(20px + env(safe-area-inset-left));
      z-index: 20;
      font-size: 0.85rem;
      font-weight: 700;
      background: rgba(0, 0, 0, 0.7);
      padding: 8px 14px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .maplibregl-ctrl-attrib, .maplibregl-ctrl-logo {
      display: none !important;
    }
  </style>
</head>
<body>

  <div id="status">Suche GPS...</div>

  <div id="controls">
    <button onclick="changeColor()">Farbe</button>
    <button id="hud-btn" onclick="toggleHUD()">HUD Mode</button>
  </div>

  <div id="app-container">
    <div id="map"></div>

    <div id="dashboard">
      <div class="speed-container">
        <span id="speed" class="speed-value">0</span>
        <span class="speed-unit">km/h</span>
      </div>

      <div id="speed-limit-badge" class="speed-limit-badge unknown">
        <span id="speed-limit" class="speed-limit-value">--</span>
      </div>
    </div>
  </div>

  <!-- MapLibre GL JS -->
  <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>

  <script>
    let map;
    let userMarker;
    let markerElement;
    let currentThemeIndex = 0;
    let lastLimitFetchPos = null;
    let hasCenteredFirstTime = false;

    const colors = [
      { name: 'Cyan', hex: '#00ffcc', glow: 'rgba(0, 255, 204, 0.6)' },
      { name: 'Red', hex: '#ff3333', glow: 'rgba(255, 51, 51, 0.6)' },
      { name: 'Lime', hex: '#33ff33', glow: 'rgba(51, 255, 51, 0.6)' },
      { name: 'Orange', hex: '#ff9900', glow: 'rgba(255, 153, 0, 0.6)' }
    ];

    function initMap() {
      // Standard-Startpunkt (wird sofort durch GPS überschrieben)
      const startPos = [10.4515, 51.1657];

      map = new maplibregl.Map({
        container: 'map',
        style: 'https://tiles.openfreemap.org/styles/dark',
        center: startPos,
        zoom: 17,
        pitch: 45,
        bearing: 0
      });

      map.on('load', () => {
        // Gebaeude und POIs ausblenden fuer Vektor-Look
        if (map.getLayer('building')) map.setLayoutProperty('building', 'visibility', 'none');
        if (map.getLayer('poi')) map.setLayoutProperty('poi', 'visibility', 'none');

        markerElement = document.createElement('div');
        markerElement.innerHTML = `
          <svg width="40" height="40" viewBox="0 0 100 100" id="user-arrow" style="transition: transform 0.2s ease;">
            <polygon points="50,10 85,85 50,68 15,85" fill="var(--accent-color)" stroke="#ffffff" stroke-width="4"/>
          </svg>
        `;

        userMarker = new maplibregl.Marker({ element: markerElement })
          .setLngLat(startPos)
          .addTo(map);

        // GPS sofort beim Laden anfordern
        startLiveTracking();
      });
    }

    // Automatisches GPS Tracking
    function startLiveTracking() {
      if ("geolocation" in navigator) {
        navigator.geolocation.watchPosition(
          (position) => {
            const lat = position.coords.latitude;
            const lng = position.coords.longitude;
            const speedMS = position.coords.speed || 0;
            const heading = position.coords.heading;

            const newPos = [lng, lat];

            document.getElementById('status').innerText = "GPS: Aktiv";

            // Zwingt die Karte beim ersten GPS-Signal direkt zum Standort zu springen
            if (!hasCenteredFirstTime) {
              map.jumpTo({ center: newPos, zoom: 17 });
              hasCenteredFirstTime = true;
            } else {
              map.flyTo({
                center: newPos,
                bearing: heading !== null && !isNaN(heading) ? heading : map.getBearing(),
                speed: 1.5,
                curve: 1,
                essential: true
              });
            }

            if (userMarker) userMarker.setLngLat(newPos);

            if (heading !== null && !isNaN(heading)) {
              const arrow = document.getElementById('user-arrow');
              if (arrow) arrow.style.transform = `rotate(${heading}deg)`;
            }

            const kmh = Math.round(speedMS * 3.6);
            document.getElementById("speed").innerText = kmh;

            fetchSpeedLimit(lat, lng);
          },
          (error) => {
            if (error.code === error.PERMISSION_DENIED) {
              document.getElementById('status').innerText = "GPS: In iOS Einstellungen erlauben";
            } else {
              document.getElementById('status').innerText = "GPS: Suche Signal...";
            }
          },
          { enableHighAccuracy: true, maximumAge: 1000, timeout: 10000 }
        );
      } else {
        document.getElementById('status').innerText = "GPS nicht verfuegbar";
      }
    }

    async function fetchSpeedLimit(lat, lng) {
      if (lastLimitFetchPos) {
        const dLat = Math.abs(lat - lastLimitFetchPos.lat);
        const dLng = Math.abs(lng - lastLimitFetchPos.lng);
        if (dLat < 0.0005 && dLng < 0.0005) return;
      }
      lastLimitFetchPos = { lat, lng };

      try {
        const query = `[out:json];way(around:25,${lat},${lng})["maxspeed"];out tags;`;
        const res = await fetch(`https://overpass-api.de/api/interpreter?data=${encodeURIComponent(query)}`);
        const data = await res.json();

        if (data.elements && data.elements.length > 0 && data.elements[0].tags.maxspeed) {
          const limit = parseInt(data.elements[0].tags.maxspeed);
          if (!isNaN(limit)) {
            document.getElementById('speed-limit').innerText = limit;
            document.getElementById('speed-limit-badge').classList.remove('unknown');
            return;
          }
        }
        document.getElementById('speed-limit-badge').classList.add('unknown');
        document.getElementById('speed-limit').innerText = "--";
      } catch (e) {}
    }

    function toggleHUD() {
      const container = document.getElementById("app-container");
      const btn = document.getElementById("hud-btn");
      container.classList.toggle("hud-mode");
      btn.classList.toggle("active");
    }

    function changeColor() {
      currentThemeIndex = (currentThemeIndex + 1) % colors.length;
      const theme = colors[currentThemeIndex];
      document.documentElement.style.setProperty('--accent-color', theme.hex);
      document.documentElement.style.setProperty('--accent-glow', theme.glow);
    }

    window.onload = initMap;
  </script>
</body>
</html>
