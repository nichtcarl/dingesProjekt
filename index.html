<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Minimal Vector HUD - Real Road Converter</title>

  <!-- iOS Safari WebApp Integration -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="HUD">

  <!-- Authentische 7-Segment Digitaluhren Schriftart -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.cdnfonts.com/css/ds-digital" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --accent-color: #ff0033;
      --accent-glow: rgba(255, 0, 51, 0.7);
      --bg-color: #000000;
      --danger-color: #ff0033;
      --speed-color: #ff0033;
      --speed-glow: rgba(255, 0, 51, 0.7);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    body, html {
      background-color: var(--bg-color);
      color: var(--accent-color);
      font-family: 'DS-Digital', 'Orbitron', monospace, sans-serif;
      overflow: hidden;
      height: 100%;
      width: 100%;
    }

    /* Haupt-Container für HUD-Spiegelung (Standardmäßig gespiegelt!) */
    #app-container {
      width: 100%;
      height: 100%;
      position: relative;
      transition: transform 0.3s ease-in-out;
      transform: scaleY(-1);
    }

    .hud-mode-disabled {
      transform: scaleY(1) !important;
    }

    /* Native Canvas Fläche */
    #hudCanvas {
      width: 100%;
      height: 100%;
      display: block;
      background-color: #000000;
    }

    /* Oben Links: Digitales Tempolimit */
    #limit-display {
      position: absolute;
      top: max(20px, env(safe-area-inset-top));
      left: max(25px, env(safe-area-inset-left));
      z-index: 20;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .limit-value {
      font-family: 'DS-Digital', sans-serif;
      font-size: clamp(3rem, 6vw, 4.2rem);
      font-weight: 900;
      letter-spacing: 2px;
      line-height: 1;
      color: var(--accent-color);
      text-shadow: 0 0 25px var(--accent-glow);
    }

    /* Unten Mitte: Digitale Geschwindigkeit */
    #speed-display {
      position: absolute;
      bottom: max(12px, env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      pointer-events: none;
    }

    .speed-value {
      font-family: 'DS-Digital', sans-serif;
      font-size: clamp(6.5rem, 14vw, 9.5rem);
      font-weight: 900;
      line-height: 0.75;
      letter-spacing: 2px;
      font-variant-numeric: tabular-nums;
      color: var(--speed-color);
      text-shadow: 0 0 40px var(--speed-glow);
      transition: color 0.75s ease-in-out, text-shadow 0.75s ease-in-out;
    }

    /* Controls Unten Rechts ("Ghost"-Look) */
    #controls {
      position: absolute;
      bottom: max(18px, env(safe-area-inset-bottom));
      right: max(25px, env(safe-area-inset-right));
      z-index: 30;
      display: flex;
      gap: 8px;
      opacity: 0.35;
      transition: opacity 0.3s ease;
    }

    #controls:hover, #controls:active {
      opacity: 0.95;
    }

    button {
      font-family: 'Orbitron', sans-serif;
      background: rgba(0, 0, 0, 0.7);
      border: 1px solid var(--accent-color);
      color: var(--accent-color);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 1px;
      cursor: pointer;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    button:active {
      background: var(--accent-color);
      color: #000;
    }

    /* Subtiler Status-Punkt unten links */
    #status-dot {
      position: absolute;
      bottom: max(15px, env(safe-area-inset-bottom));
      left: max(25px, env(safe-area-inset-left));
      z-index: 20;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: var(--accent-color);
      opacity: 0.3;
    }
  </style>
</head>
<body>

  <div id="app-container">
    <canvas id="hudCanvas"></canvas>

    <!-- Oben Links: Reiner Tempolimit-Wert -->
    <div id="limit-display">
      <span id="speed-limit" class="limit-value">--</span>
    </div>

    <!-- Controls Unten Rechts -->
    <div id="controls">
      <button onclick="toggleDayNightManual()">MODE</button>
      <button id="hud-btn" onclick="toggleHUD()">HUD</button>
    </div>

    <!-- Status Punkt -->
    <div id="status-dot"></div>

    <!-- Unten Mitte: Geschwindigkeits-Wert -->
    <div id="speed-display">
      <span id="speed" class="speed-value">0</span>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('hudCanvas');
    const ctx = canvas.getContext('2d');

    let currentSpeed = 0;
    let targetSpeed = 0;
    let speedLimit = null;
    let isSpeeding = false;
    let flashInterval = null;
    let flashState = false;

    let dnaTimer = 0;

    // GPS Ziel- & Ist-Positionen
    let targetLat = 50.8163;
    let targetLng = 7.1725;
    let targetHeading = 0;

    let renderLat = 50.8163;
    let renderLng = 7.1725;
    let renderHeading = 0;

    // Kamera-Neigung (0.0 = Top Down, 1.0 = 3D-Kamerafahrt)
    let currentPitch = 0.0; 
    let targetPitch = 0.0;

    // Sichtweite in Metern
    let viewRange = 300; 
    let targetViewRange = 300;

    // Array für ECHTE Strassengeometrien aus OpenStreetMap
    let realRoads = [];
    let lastFetchedPos = null;

    const themes = {
      night: { 
        hex: '#ff0033', 
        glow: 'rgba(255, 0, 51, 0.7)', 
        arrow: '#ffffff', 
        arrowGlow: 'rgba(255, 255, 255, 0.9)' 
      },
      day: { 
        hex: '#ffffff', 
        glow: 'rgba(255, 255, 255, 0.7)', 
        arrow: '#ff0033', 
        arrowGlow: 'rgba(255, 0, 51, 0.9)' 
      }
    };
    let currentMode = 'night';

    function resizeCanvas() {
      canvas.width = window.innerWidth * window.devicePixelRatio;
      canvas.height = window.innerHeight * window.devicePixelRatio;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Berechnet exakten Sonnenuntergang
    function calculateSunsetHour(lat, lng) {
      const now = new Date();
      const startOfYear = new Date(now.getFullYear(), 0, 0);
      const dayOfYear = Math.floor((now - startOfYear) + ((startOfYear.getTimezoneOffset() - now.getTimezoneOffset()) * 60000)) / 86400000;
      
      const p = Math.asin(0.39795 * Math.sin((0.98565 * (dayOfYear - 173) + 3.1517) * Math.PI / 180));
      const latRad = lat * Math.PI / 180;
      const hourAngle = Math.acos(-Math.tan(latRad) * Math.tan(p));
      
      if (isNaN(hourAngle)) return 18;

      const sunsetTimeUTC = 12 + (hourAngle * 180 / Math.PI) / 15 - (lng / 15);
      return sunsetTimeUTC - (now.getTimezoneOffset() / 60);
    }

    function autoDetectNightMode(lat, lng) {
      const now = new Date();
      const currentDecimalHour = now.getHours() + (now.getMinutes() / 60);
      
      const sunsetHour = calculateSunsetHour(lat, lng);
      const nightModeStartHour = sunsetHour - 1.0;
      const sunriseHour = 24 - sunsetHour;

      return (currentDecimalHour >= nightModeStartHour || currentDecimalHour < sunriseHour) ? 'night' : 'day';
    }

    // CONVERTER: Konvertiert echte OpenStreetMap Straßen-Vektoren
    async function fetchRealRoads(lat, lng) {
      if (lastFetchedPos) {
        const dLat = Math.abs(lat - lastFetchedPos.lat);
        const dLng = Math.abs(lng - lastFetchedPos.lng);
        if (dLat < 0.0015 && dLng < 0.0015) return;
      }
      lastFetchedPos = { lat, lng };

      try {
        // Fragt alle echten befahrbaren Straßen im Umkreis von 1000m ab
        const query = `[out:json][timeout:10];way(around:1000,${lat},${lng})["highway"];out tags geometry;`;
        const res = await fetch(`https://overpass-api.de/api/interpreter?data=${encodeURIComponent(query)}`);
        const data = await res.json();

        if (data.elements && data.elements.length > 0) {
          const loaded = data.elements.filter(el => el.geometry && el.geometry.length > 1).map(el => ({
            type: el.tags ? el.tags.highway : 'road',
            width: (el.tags && (el.tags.highway === 'primary' || el.tags.highway === 'secondary' || el.tags.highway === 'motorway')) ? 14 : 8,
            nodes: el.geometry.map(pt => ({ lat: pt.lat, lng: pt.lon }))
          }));
          
          if (loaded.length > 0) {
            realRoads = loaded;
          }

          // Echtes Tempolimit aus OpenStreetMap auslesen
          const wayWithSpeed = data.elements.find(el => el.tags && el.tags.maxspeed);
          if (wayWithSpeed) {
            const limit = parseInt(wayWithSpeed.tags.maxspeed);
            if (!isNaN(limit)) {
              speedLimit = limit;
              document.getElementById('speed-limit').innerText = limit;
            }
          }
        }
      } catch (e) {
        // Fehlerbehandlung
      }
    }

    // WGS84 GPS-Koordinaten Converter -> Lokale Meter relativ zum Fahrzeug
    function gpsToLocalMeters(lat, lng, refLat, refLng) {
      const rad = Math.PI / 180;
      const x = (lng - refLng) * 111320 * Math.cos(refLat * rad);
      const y = (lat - refLat) * 110540;
      return { x, y };
    }

    function lerpAngle(start, end, amount) {
      let da = (end - start) % 360;
      if (da < -180) da += 360;
      if (da > 180) da -= 360;
      return start + da * amount;
    }

    function handleSpeedingFlashing(speeding) {
      if (speeding && !isSpeeding) {
        isSpeeding = true;
        flashState = false;
        if (flashInterval) clearInterval(flashInterval);
        
        flashInterval = setInterval(() => {
          flashState = !flashState;
          const root = document.documentElement;
          if (flashState) {
            root.style.setProperty('--speed-color', '#ffffff');
            root.style.setProperty('--speed-glow', 'rgba(255, 255, 255, 0.9)');
          } else {
            root.style.setProperty('--speed-color', '#ff0033');
            root.style.setProperty('--speed-glow', 'rgba(255, 0, 51, 0.9)');
          }
        }, 750);
      } else if (!speeding && isSpeeding) {
        isSpeeding = false;
        if (flashInterval) clearInterval(flashInterval);
        flashInterval = null;
        applyTheme(currentMode);
      }
    }

    // DNA-Spule Oben Rechts
    function drawRetroDNAVisualizer(ctx, w, h, accent) {
      ctx.save();
      
      const dnaWidth = Math.min(220, w * 0.22);
      const dnaHeight = 42;
      const marginRight = Math.max(40, w * 0.05);
      const marginTop = Math.max(35, h * 0.08);

      const startX = w - dnaWidth - marginRight;
      const startY = marginTop;

      const speedRotation = 0.008 + (currentSpeed * 0.0008);
      dnaTimer += speedRotation;

      ctx.strokeStyle = accent;
      ctx.fillStyle = accent;
      ctx.shadowColor = accent;
      ctx.shadowBlur = 12;
      ctx.lineWidth = 2;

      const numPoints = 14;
      const spacing = dnaWidth / numPoints;

      for (let i = 0; i < numPoints; i++) {
        const x = startX + (i * spacing);
        const angle = dnaTimer + (i * 0.45);

        const y1 = startY + Math.sin(angle) * (dnaHeight / 2);
        const y2 = startY - Math.sin(angle) * (dnaHeight / 2);

        ctx.globalAlpha = 0.3;
        ctx.beginPath();
        ctx.moveTo(x, y1);
        ctx.lineTo(x, y2);
        ctx.stroke();

        ctx.globalAlpha = 0.9;
        ctx.beginPath();
        ctx.arc(x, y1, 3.5, 0, Math.PI * 2);
        ctx.fill();

        ctx.beginPath();
        ctx.arc(x, y2, 3.5, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.restore();
    }

    // HAUPT-RENDER-ENGINE: Rendert echte Vektor-Straßen
    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      renderLat += (targetLat - renderLat) * 0.05;
      renderLng += (targetLng - renderLng) * 0.05;
      renderHeading = lerpAngle(renderHeading, targetHeading, 0.05);
      currentSpeed += (targetSpeed - currentSpeed) * 0.08;

      const displayKmh = Math.round(currentSpeed);
      document.getElementById('speed').innerText = displayKmh;

      handleSpeedingFlashing(speedLimit && displayKmh > speedLimit);

      const w = canvas.width;
      const h = canvas.height;
      const cx = w / 2;
      const cy = h / 2;
      const activeTheme = themes[currentMode];
      const accent = activeTheme.hex;

      currentPitch += (targetPitch - currentPitch) * 0.035;
      viewRange += (targetViewRange - viewRange) * 0.035;

      ctx.save();
      ctx.translate(cx, cy);

      const headingRad = (renderHeading * Math.PI) / 180;
      const cosH = Math.cos(-headingRad);
      const sinH = Math.sin(-headingRad);

      // ECHTE STRASSEN TRANSFORMIEREN & RENDERN
      if (realRoads.length > 0) {
        ctx.strokeStyle = accent;
        ctx.shadowColor = accent;
        ctx.shadowBlur = 12;

        realRoads.forEach(road => {
          const roadWidthMeters = road.width || 10;

          for (let i = 0; i < road.nodes.length - 1; i++) {
            const p1 = road.nodes[i];
            const p2 = road.nodes[i + 1];

            // 1. Umrechnung GPS in Meter relativ zum Auto
            const l1 = gpsToLocalMeters(p1.lat, p1.lng, renderLat, renderLng);
            const l2 = gpsToLocalMeters(p2.lat, p2.lng, renderLat, renderLng);

            // 2. Drehung nach Blickrichtung / Heading
            const r1 = { x: l1.x * cosH - l1.y * sinH, y: l1.x * sinH + l1.y * cosH };
            const r2 = { x: l2.x * cosH - l2.y * sinH, y: l2.x * sinH + l2.y * cosH };

            // 3. Sichtfeld-Filtering
            if ((Math.abs(r1.y) < viewRange && Math.abs(r1.x) < viewRange) || 
                (Math.abs(r2.y) < viewRange && Math.abs(r2.x) < viewRange)) {
              
              // 4. Dynamische 3D-Kamera-Projektionsmatrix
              const scale1 = 1 / (1 + (r1.y * 0.0028 * currentPitch));
              const scale2 = 1 / (1 + (r2.y * 0.0028 * currentPitch));

              const x1 = r1.x * 2.8 * scale1;
              const y1 = -r1.y * 2.8 * scale1 * (1 - (currentPitch * 0.52));

              const x2 = r2.x * 2.8 * scale2;
              const y2 = -r2.y * 2.8 * scale2 * (1 - (currentPitch * 0.52));

              const avgY = (r1.y + r2.y) / 2;
              const currentScale = 1 / (1 + (avgY * 0.0028 * currentPitch));
              const projectedLineWidth = Math.max(2, roadWidthMeters * 1.8 * currentScale);

              // Straßensegment zeichnen
              ctx.lineWidth = projectedLineWidth;
              ctx.beginPath();
              ctx.moveTo(x1, y1);
              ctx.lineTo(x2, y2);
              ctx.stroke();

              // Glühende Fahrbahnränder
              ctx.save();
              ctx.lineWidth = 1.5;
              ctx.globalAlpha = 0.5;
              const dx = x2 - x1;
              const dy = y2 - y1;
              const len = Math.sqrt(dx * dx + dy * dy);
              if (len > 0) {
                const nx = -dy / len * (projectedLineWidth / 2);
                const ny = dx / len * (projectedLineWidth / 2);

                ctx.beginPath();
                ctx.moveTo(x1 + nx, y1 + ny);
                ctx.lineTo(x2 + nx, y2 + ny);
                ctx.moveTo(x1 - nx, y1 - ny);
                ctx.lineTo(x2 - nx, y2 - ny);
                ctx.stroke();
              }
              ctx.restore();
            }
          }
        });
      }

      ctx.restore();

      // Horizont Fade-Out Rand
      const fadeGrad = ctx.createRadialGradient(cx, cy, 30, cx, cy, viewRange * 0.75);
      fadeGrad.addColorStop(0, 'rgba(0, 0, 0, 0)');
      fadeGrad.addColorStop(0.7, 'rgba(0, 0, 0, 0.4)');
      fadeGrad.addColorStop(1, 'rgba(0, 0, 0, 1)');
      
      ctx.fillStyle = fadeGrad;
      ctx.fillRect(0, 0, w, h);

      // Fahrzeug-Pfeil
      ctx.save();
      ctx.translate(cx, cy);
      ctx.fillStyle = activeTheme.arrow;
      ctx.shadowColor = activeTheme.arrow;
      ctx.shadowBlur = 25;

      ctx.beginPath();
      ctx.moveTo(0, -26);
      ctx.lineTo(18, 18);
      ctx.lineTo(0, 9);
      ctx.lineTo(-18, 18);
      ctx.closePath();
      ctx.fill();

      ctx.strokeStyle = '#000000';
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.restore();

      // DNA Visualizer Welle
      drawRetroDNAVisualizer(ctx, w, h, accent);

      requestAnimationFrame(render);
    }

    function updatePerspective(kmh) {
      targetSpeed = kmh;

      if (kmh > 5) {
        targetPitch = 1.0;
        targetViewRange = Math.min(350 + (kmh * 7), 850);
      } else {
        targetPitch = 0.0;
        targetViewRange = 280;
      }
    }

    // Automatisches GPS Live-Tracking
    function startAutomaticTracking() {
      if ("geolocation" in navigator) {
        navigator.geolocation.watchPosition(
          (pos) => {
            targetLat = pos.coords.latitude;
            targetLng = pos.coords.longitude;
            if (pos.coords.heading !== null && !isNaN(pos.coords.heading)) {
              targetHeading = pos.coords.heading;
            }

            document.getElementById('status-dot').style.backgroundColor = '#00ffcc';

            currentMode = autoDetectNightMode(targetLat, targetLng);
            applyTheme(currentMode);

            const speedMS = pos.coords.speed || 0;
            const kmh = Math.round(speedMS * 3.6);
            updatePerspective(kmh);

            // Echte Straßendaten der aktuellen Position abrufen & konvertieren
            fetchRealRoads(targetLat, targetLng);
          },
          (err) => {
            document.getElementById('status-dot').style.backgroundColor = '#ff0033';
          },
          { enableHighAccuracy: true, maximumAge: 1000, timeout: 10000 }
        );
      }
    }

    function applyTheme(mode) {
      const theme = themes[mode];
      document.documentElement.style.setProperty('--accent-color', theme.hex);
      document.documentElement.style.setProperty('--accent-glow', theme.glow);
      if (!isSpeeding) {
        document.documentElement.style.setProperty('--speed-color', theme.hex);
        document.documentElement.style.setProperty('--speed-glow', theme.glow);
      }
    }

    function toggleDayNightManual() {
      currentMode = (currentMode === 'night') ? 'day' : 'night';
      applyTheme(currentMode);
    }

    function toggleHUD() {
      const container = document.getElementById("app-container");
      container.classList.toggle("hud-mode-disabled");
    }

    window.onload = () => {
      currentMode = autoDetectNightMode(targetLat, targetLng);
      applyTheme(currentMode);

      startAutomaticTracking();
      render();
    };
  </script>
</body>
</html>
