<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Minimal Vector HUD</title>

  <!-- iOS Safari WebApp Integration -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="HUD">

  <!-- Schriften -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.cdnfonts.com/css/ds-digital" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">

  <style>
    :root {
      --accent-color: #ff0033;
      --accent-glow: rgba(255, 0, 51, 0.9);
      --bg-color: #000000;
      --speed-color: #ff0033;
      --speed-glow: rgba(255, 0, 51, 0.9);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    body, html {
      background-color: var(--bg-color);
      color: var(--accent-color);
      font-family: 'DS-Digital', 'Orbitron', monospace, sans-serif;
      overflow: hidden;
      height: 100%;
      width: 100%;
    }

    /* Start Overlay */
    #start-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #000000;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 15px;
    }

    .start-btn {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.2rem;
      padding: 18px 36px;
      border-radius: 16px;
      background: transparent;
      border: 2px solid var(--accent-color);
      color: var(--accent-color);
      font-weight: 900;
      letter-spacing: 3px;
      cursor: pointer;
      box-shadow: 0 0 25px var(--accent-glow);
    }

    .start-btn:active {
      background: var(--accent-color);
      color: #000;
    }

    /* Haupt-Container für HUD-Spiegelung (Standardmäßig gespiegelt!) */
    #app-container {
      width: 100%;
      height: 100%;
      position: relative;
      transition: transform 0.3s ease-in-out;
      transform: scaleY(-1);
      background-color: #000000;
    }

    .hud-mode-disabled {
      transform: scaleY(1) !important;
    }

    /* Canvas für echtes reines Vektor-Rendering */
    #vectorCanvas {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      background-color: #000000;
      z-index: 5;
    }

    /* Oben Links: Digitales Tempolimit */
    #limit-display {
      position: absolute;
      top: max(20px, env(safe-area-inset-top));
      left: max(25px, env(safe-area-inset-left));
      z-index: 20;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .limit-value {
      font-family: 'DS-Digital', sans-serif;
      font-size: clamp(3rem, 6vw, 4.2rem);
      font-weight: 900;
      letter-spacing: 2px;
      line-height: 1;
      color: var(--accent-color);
      text-shadow: 0 0 25px var(--accent-glow);
    }

    /* Unten Mitte: Digitale Geschwindigkeit */
    #speed-display {
      position: absolute;
      bottom: max(12px, env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      pointer-events: none;
    }

    .speed-value {
      font-family: 'DS-Digital', sans-serif;
      font-size: clamp(6.5rem, 14vw, 9.5rem);
      font-weight: 900;
      line-height: 0.75;
      letter-spacing: 2px;
      font-variant-numeric: tabular-nums;
      color: var(--speed-color);
      text-shadow: 0 0 40px var(--speed-glow);
      transition: color 0.75s ease-in-out, text-shadow 0.75s ease-in-out;
    }

    /* Unten Links: Aktuelle Adresse / GPS Status */
    #address-display {
      position: absolute;
      bottom: max(15px, env(safe-area-inset-bottom));
      left: max(25px, env(safe-area-inset-left));
      z-index: 20;
      pointer-events: none;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    #status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #ffaa00;
      box-shadow: 0 0 10px rgba(255, 170, 0, 0.8);
      flex-shrink: 0;
    }

    .address-text {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.75rem;
      letter-spacing: 1px;
      color: var(--accent-color);
      text-transform: uppercase;
      opacity: 0.85;
      text-shadow: 0 0 10px var(--accent-glow);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 280px;
    }

    /* Controls Unten Rechts */
    #controls {
      position: absolute;
      bottom: max(18px, env(safe-area-inset-bottom));
      right: max(25px, env(safe-area-inset-right));
      z-index: 30;
      display: flex;
      gap: 8px;
      opacity: 0.35;
      transition: opacity 0.3s ease;
    }

    #controls:hover, #controls:active {
      opacity: 0.95;
    }

    button {
      font-family: 'Orbitron', sans-serif;
      background: rgba(0, 0, 0, 0.7);
      border: 1px solid var(--accent-color);
      color: var(--accent-color);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 1px;
      cursor: pointer;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    button:active {
      background: var(--accent-color);
      color: #000;
    }
  </style>
</head>
<body>

  <!-- Start Overlay -->
  <div id="start-overlay">
    <button class="start-btn" onclick="startHUDWithClick()">START HUD</button>
  </div>

  <div id="app-container">
    <!-- Reiner Canvas für Vektorstraßen & DNA -->
    <canvas id="vectorCanvas"></canvas>

    <!-- Oben Links: Reiner Tempolimit-Wert -->
    <div id="limit-display">
      <span id="speed-limit" class="limit-value">--</span>
    </div>

    <!-- Controls Unten Rechts -->
    <div id="controls">
      <button onclick="forceLocationReload()">GPS</button>
      <button onclick="toggleDayNightManual()">MODE</button>
      <button id="hud-btn" onclick="toggleHUD()">HUD</button>
    </div>

    <!-- Unten Links: Live-Adresse & GPS Status -->
    <div id="address-display">
      <div id="status-dot"></div>
      <span id="address-label" class="address-text">SUCHE POSITION...</span>
    </div>

    <!-- Unten Mitte: Geschwindigkeits-Wert -->
    <div id="speed-display">
      <span id="speed" class="speed-value">0</span>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('vectorCanvas');
    const ctx = canvas.getContext('2d');

    let currentSpeed = 0;
    let speedLimit = null;
    let isSpeeding = false;
    let flashInterval = null;
    let flashState = false;

    let dnaTimer = 0;
    let currentLat = 50.8163;
    let currentLng = 7.1725;
    let currentHeading = 0;
    let lastLimitFetchPos = null;
    let osmWays = [];

    let cameraPitch = 0; 
    let targetPitchSetting = 0;

    const themes = {
      night: { hex: '#ff0033', glow: 'rgba(255, 0, 51, 0.9)', arrow: '#ffffff' },
      day: { hex: '#ffffff', glow: 'rgba(255, 255, 255, 0.9)', arrow: '#ff0033' }
    };
    let currentMode = 'night';

    function resizeCanvas() {
      canvas.width = window.innerWidth * window.devicePixelRatio;
      canvas.height = window.innerHeight * window.devicePixelRatio;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function calculateSunsetHour(lat, lng) {
      const now = new Date();
      const startOfYear = new Date(now.getFullYear(), 0, 0);
      const dayOfYear = Math.floor((now - startOfYear) + ((startOfYear.getTimezoneOffset() - now.getTimezoneOffset()) * 60000)) / 86400000;
      const p = Math.asin(0.39795 * Math.sin((0.98565 * (dayOfYear - 173) + 3.1517) * Math.PI / 180));
      const latRad = lat * Math.PI / 180;
      const hourAngle = Math.acos(-Math.tan(latRad) * Math.tan(p));
      if (isNaN(hourAngle)) return 18;
      const sunsetTimeUTC = 12 + (hourAngle * 180 / Math.PI) / 15 - (lng / 15);
      return sunsetTimeUTC - (now.getTimezoneOffset() / 60);
    }

    function autoDetectNightMode(lat, lng) {
      const now = new Date();
      const currentDecimalHour = now.getHours() + (now.getMinutes() / 60);
      const sunsetHour = calculateSunsetHour(lat, lng);
      const nightModeStartHour = sunsetHour - 1.0;
      const sunriseHour = 24 - sunsetHour;
      return (currentDecimalHour >= nightModeStartHour || currentDecimalHour < sunriseHour) ? 'night' : 'day';
    }

    async function fetchAddressLabel(lat, lng) {
      try {
        const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&zoom=18&addressdetails=1`);
        const data = await res.json();
        if (data && data.address) {
          const road = data.address.road || data.address.pedestrian || data.address.suburb || "UNBEKANNTE STRASSE";
          const city = data.address.city || data.address.town || data.address.village || "";
          document.getElementById('address-label').innerText = city ? `${road}, ${city}` : road;
        }
      } catch (e) {
        document.getElementById('address-label').innerText = `${lat.toFixed(4)}°, ${lng.toFixed(4)}°`;
      }
    }

    async function fetchSpeedLimit(lat, lng) {
      if (lastLimitFetchPos) {
        const dLat = Math.abs(lat - lastLimitFetchPos.lat);
        const dLng = Math.abs(lng - lastLimitFetchPos.lng);
        if (dLat < 0.001 && dLng < 0.001) return;
      }
      lastLimitFetchPos = { lat, lng };
      fetchAddressLabel(lat, lng);

      try {
        const query = `[out:json][timeout:5];way(around:30,${lat},${lng})["maxspeed"];out tags;`;
        const res = await fetch(`https://overpass-api.de/api/interpreter?data=${encodeURIComponent(query)}`);
        const data = await res.json();
        if (data.elements && data.elements.length > 0 && data.elements[0].tags.maxspeed) {
          const limit = parseInt(data.elements[0].tags.maxspeed);
          if (!isNaN(limit)) {
            speedLimit = limit;
            document.getElementById('speed-limit').innerText = limit;
            return;
          }
        }
        speedLimit = null;
        document.getElementById('speed-limit').innerText = "--";
      } catch (e) {}
    }

    async function fetchVectorRoads(lat, lng) {
      try {
        const query = `[out:json][timeout:5];way(around:400,${lat},${lng})["highway"];out geom;`;
        const res = await fetch(`https://overpass-api.de/api/interpreter?data=${encodeURIComponent(query)}`);
        const data = await res.json();
        if (data.elements) {
          osmWays = data.elements.filter(el => el.geometry && el.geometry.length > 1);
        }
      } catch (e) {}
    }

    function handleSpeedingFlashing(speeding) {
      if (speeding && !isSpeeding) {
        isSpeeding = true;
        flashState = false;
        if (flashInterval) clearInterval(flashInterval);
        flashInterval = setInterval(() => {
          flashState = !flashState;
          const root = document.documentElement;
          if (flashState) {
            root.style.setProperty('--speed-color', '#ffffff');
            root.style.setProperty('--speed-glow', 'rgba(255, 255, 255, 0.9)');
          } else {
            root.style.setProperty('--speed-color', '#ff0033');
            root.style.setProperty('--speed-glow', 'rgba(255, 0, 51, 0.9)');
          }
        }, 750);
      } else if (!speeding && isSpeeding) {
        isSpeeding = false;
        if (flashInterval) clearInterval(flashInterval);
        flashInterval = null;
        applyTheme(currentMode);
      }
    }

    // Canvas Render Loop
    function renderHUDCanvas() {
      ctx.fillStyle = '#000000';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const w = canvas.width;
      const h = canvas.height;
      const accent = themes[currentMode].hex;

      const targetP = currentSpeed > 5 ? 1 : 0;
      cameraPitch += (targetP - cameraPitch) * 0.05;

      const centerX = w / 2;
      const centerY = h * (0.55 + cameraPitch * 0.25);

      const scale = Math.min(w, h) * 45000;

      ctx.save();
      if (cameraPitch < 0.05) {
        ctx.translate(centerX, centerY);
        ctx.rotate((-currentHeading * Math.PI) / 180);
        ctx.translate(-centerX, -centerY);
      }

      // Neon-Straßen zeichnen
      ctx.strokeStyle = accent;
      ctx.shadowColor = accent;
      ctx.shadowBlur = 18;
      ctx.lineWidth = Math.max(3, w * 0.004);
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      if (osmWays.length === 0) {
        // Fallback-Vektornetz, falls API lädt
        ctx.beginPath();
        ctx.moveTo(centerX - 150, centerY + 200);
        ctx.lineTo(centerX - 150, centerY - 300);
        ctx.lineTo(centerX + 250, centerY - 300);
        ctx.stroke();
      }

      osmWays.forEach(way => {
        const geom = way.geometry;
        ctx.beginPath();
        let started = false;

        for (let i = 0; i < geom.length; i++) {
          const pt = geom[i];
          const dLon = (pt.lon - currentLng) * Math.cos(currentLat * Math.PI / 180);
          const dLat = (pt.lat - currentLat);

          let px = centerX + dLon * scale;
          let py = centerY - dLat * scale;

          if (cameraPitch > 0.01) {
            const relY = py - centerY;
            const perspectiveFactor = 1 / (1 + Math.max(0, -relY) * 0.002 * cameraPitch);
            px = centerX + (px - centerX) * perspectiveFactor;
            py = centerY + relY * (1 + cameraPitch * 1.5);
          }

          if (!started) {
            ctx.moveTo(px, py);
            started = true;
          } else {
            ctx.lineTo(px, py);
          }
        }
        ctx.stroke();
      });

      ctx.restore();

      // Fahrzeug-Pfeil
      ctx.save();
      ctx.translate(centerX, centerY);
      if (cameraPitch < 0.05) {
        ctx.rotate((currentHeading * Math.PI) / 180);
      }

      ctx.strokeStyle = '#000000';
      ctx.lineWidth = 4;
      ctx.fillStyle = themes[currentMode].arrow;
      ctx.shadowColor = themes[currentMode].arrow;
      ctx.shadowBlur = 20;

      ctx.beginPath();
      ctx.moveTo(0, -26);
      ctx.lineTo(18, 24);
      ctx.lineTo(0, 12);
      ctx.lineTo(-18, 24);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
      ctx.restore();

      drawRetroDNAVisualizer(w, h, accent);

      requestAnimationFrame(renderHUDCanvas);
    }

    function drawRetroDNAVisualizer(w, h, accent) {
      const dnaWidth = Math.min(220, w * 0.22);
      const dnaHeight = 42;
      const marginRight = Math.max(40, w * 0.05);
      const marginTop = Math.max(35, h * 0.08);

      const startX = w - dnaWidth - marginRight;
      const startY = marginTop;

      const speedRotation = 0.008 + (currentSpeed * 0.0008);
      dnaTimer += speedRotation;

      ctx.save();
      ctx.strokeStyle = accent;
      ctx.fillStyle = accent;
      ctx.shadowColor = accent;
      ctx.shadowBlur = 15;
      ctx.lineWidth = 2.5;

      const numPoints = 14;
      const spacing = dnaWidth / numPoints;

      for (let i = 0; i < numPoints; i++) {
        const x = startX + (i * spacing);
        const angle = dnaTimer + (i * 0.45);

        const y1 = startY + Math.sin(angle) * (dnaHeight / 2);
        const y2 = startY - Math.sin(angle) * (dnaHeight / 2);

        ctx.globalAlpha = 0.35;
        ctx.beginPath();
        ctx.moveTo(x, y1);
        ctx.lineTo(x, y2);
        ctx.stroke();

        ctx.globalAlpha = 0.95;
        ctx.beginPath();
        ctx.arc(x, y1, 4, 0, Math.PI * 2);
        ctx.fill();

        ctx.beginPath();
        ctx.arc(x, y2, 4, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    function startHUDWithClick() {
      document.getElementById('start-overlay').style.display = 'none';
      forceLocationReload();
      requestAnimationFrame(renderHUDCanvas);
    }

    function forceLocationReload() {
      document.getElementById('status-dot').style.backgroundColor = '#ffaa00';
      document.getElementById('status-dot').style.boxShadow = '0 0 10px rgba(255, 170, 0, 0.8)';
      document.getElementById('address-label').innerText = "SUCHE GPS...";

      if ("geolocation" in navigator) {
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            currentLat = pos.coords.latitude;
            currentLng = pos.coords.longitude;
            fetchSpeedLimit(currentLat, currentLng);
            fetchVectorRoads(currentLat, currentLng);

            document.getElementById('status-dot').style.backgroundColor = '#00ffcc';
            document.getElementById('status-dot').style.boxShadow = '0 0 10px rgba(0, 255, 204, 0.8)';
          },
          (err) => {
            document.getElementById('address-label').innerText = "GPS ERFORDERLICH";
          },
          { enableHighAccuracy: true, timeout: 8000 }
        );

        navigator.geolocation.watchPosition(
          (pos) => {
            currentLat = pos.coords.latitude;
            currentLng = pos.coords.longitude;
            if (pos.coords.heading !== null && !isNaN(pos.coords.heading)) {
              currentHeading = pos.coords.heading;
            }
            const speedMS = pos.coords.speed || 0;
            const kmh = Math.round(speedMS * 3.6);
            currentSpeed = kmh;

            document.getElementById('speed').innerText = kmh;
            handleSpeedingFlashing(speedLimit && kmh > speedLimit);

            currentMode = autoDetectNightMode(currentLat, currentLng);
            applyTheme(currentMode);

            fetchSpeedLimit(currentLat, currentLng);
            fetchVectorRoads(currentLat, currentLng);
          },
          (err) => {},
          { enableHighAccuracy: true, maximumAge: 1000, timeout: 10000 }
        );
      }
    }

    function applyTheme(mode) {
      const theme = themes[mode];
      document.documentElement.style.setProperty('--accent-color', theme.hex);
      document.documentElement.style.setProperty('--accent-glow', theme.glow);
      if (!isSpeeding) {
        document.documentElement.style.setProperty('--speed-color', theme.hex);
        document.documentElement.style.setProperty('--speed-glow', theme.glow);
      }
    }

    function toggleDayNightManual() {
      currentMode = (currentMode === 'night') ? 'day' : 'night';
      applyTheme(currentMode);
    }

    function toggleHUD() {
      const container = document.getElementById("app-container");
      container.classList.toggle("hud-mode-disabled");
    }

    window.onload = () => {
      currentMode = autoDetectNightMode(currentLat, currentLng);
      applyTheme(currentMode);
    };
  </script>
</body>
</html>
